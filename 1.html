<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity | Admin Dashboard</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1L-Jv5pLOJz2dAsW4uTAaUzU0eM1ToErw">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --bg-header: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --header-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        /* App Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* Top Header */
        .admin-header {
            height: var(--header-height);
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--text-light);
        }

        .badge-admin {
            background-color: rgba(79, 70, 229, 0.2);
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.3);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        /* Header Actions */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.45rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            border-color: #475569;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        /* Iframe Main Wrapper */
        .iframe-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - var(--header-height));
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Spinner Overlay */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            margin-top: 1rem;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .btn-text {
                display: none;
            }
            .brand-title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navigation Bar -->
        <header class="admin-header">
            <div class="brand-section">
                <img src="https://lh3.googleusercontent.com/d/1L-Jv5pLOJz2dAsW4uTAaUzU0eM1ToErw" alt="Serenity Logo" class="brand-logo">
                <span class="brand-title">Serenity Booking</span>
                <span class="badge-admin">Admin</span>
            </div>

            <div class="header-actions">
                <button class="btn-action" id="refreshBtn" title="Refresh Admin View">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="btn-text">Refresh</span>
                </button>

                <button class="btn-action" id="fullscreenBtn" title="Toggle Fullscreen">
                    <i class="fa-solid fa-expand" id="fullscreenIcon"></i>
                    <span class="btn-text">Fullscreen</span>
                </button>

                <a href="https://script.google.com/macros/s/AKfycbwA5KvHX8ou8q5J2bBpCTZLEDm8i43xiRwRLR2OFUZRcJjCNQTP56FbE4DoZzKNvCGjuA/exec?page=client" target="_blank" class="btn-action btn-primary" title="Open Client View">
                    <i class="fa-solid fa-external-link-alt"></i>
                    <span class="btn-text">Client Portal</span>
                </a>
            </div>
        </header>

        <!-- Main Content (Iframe & Loader) -->
        <main class="iframe-container">
            <div class="loader-overlay" id="loader">
                <div class="spinner"></div>
                <div class="loading-text">Loading Admin Dashboard...</div>
            </div>

            <iframe 
                id="adminIframe"
                src="https://script.google.com/macros/s/AKfycbwA5KvHX8ou8q5J2bBpCTZLEDm8i43xiRwRLR2OFUZRcJjCNQTP56FbE4DoZzKNvCGjuA/exec?page=admin" 
                title="Serenity Admin Console"
                allow="geolocation; microphone; camera; autoplay; encrypted-media; clipboard-write"
                loading="eager">
            </iframe>
        </main>
    </div>

    <script>
        const iframe = document.getElementById('adminIframe');
        const loader = document.getElementById('loader');
        const refreshBtn = document.getElementById('refreshBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');

        // Hide loader when iframe finishes loading
        iframe.addEventListener('load', () => {
            loader.classList.add('hidden');
        });

        // Refresh Iframe
        refreshBtn.addEventListener('click', () => {
            loader.classList.remove('hidden');
            iframe.src = iframe.src; // Reloads the iframe URL
        });

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
                fullscreenIcon.className = 'fa-solid fa-compress';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenIcon.className = 'fa-solid fa-expand';
                }
            }
        });

        // Event listener for exiting fullscreen with ESC key
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenIcon.className = 'fa-solid fa-expand';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKING SYSTEM</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1L-Jv5pLOJz2dAsW4uTAaUzU0eM1ToErw">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .booking-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbz0ngrnhn_QzHN89IFkwwq3I3WmBfjbNX8dXOwUfTZ1rbUSZdJGQZHsN1maZmVAyExPnQ/exec" 
            title="Serenity Client View"
            allow="geolocation; microphone; camera; autoplay; encrypted-media">
        </iframe>
    </div>
</body>
</html>
